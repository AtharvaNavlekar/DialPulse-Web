<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="100%" height="24" preserveAspectRatio="none">
  <defs>
    <!-- Background track gradient -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00695C" stop-opacity="0" />
      <stop offset="25%" stop-color="#00695C" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#00695C" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#00695C" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00695C" stop-opacity="0" />
    </linearGradient>

    <!-- Animated pulse beam gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004D40" stop-opacity="0" />
      <stop offset="35%" stop-color="#00695C" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="1" />
      <stop offset="65%" stop-color="#00695C" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#004D40" stop-opacity="0" />
    </linearGradient>

    <!-- Center node pulse glow -->
    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" />
    </filter>
  </defs>

  <!-- Baseline track -->
  <path d="M 0,12 L 400,12 L 420,12 L 435,7 L 450,17 L 465,4 L 480,20 L 495,2 L 505,22 L 515,8 L 525,16 L 540,12 L 560,12 L 580,7 L 595,17 L 610,12 L 1000,12"
        fill="none" stroke="url(#trackGrad)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Animated heartbeat pulse stroke -->
  <path d="M 0,12 L 400,12 L 420,12 L 435,7 L 450,17 L 465,4 L 480,20 L 495,2 L 505,22 L 515,8 L 525,16 L 540,12 L 560,12 L 580,7 L 595,17 L 610,12 L 1000,12"
        fill="none" stroke="url(#beamGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="140 860" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0" dur="2.8s" repeatCount="indefinite" />
  </path>

  <!-- Center Telemetry Beacon Node -->
  <circle cx="500" cy="12" r="3" fill="#10B981">
    <animate attributeName="r" values="2;3.8;2" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="500" cy="12" r="6" fill="#00695C" opacity="0.25" filter="url(#pulseGlow)">
    <animate attributeName="r" values="3;8;3" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.8s" repeatCount="indefinite" />
  </circle>
</svg>
